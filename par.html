<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Border Text</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }

    .gradient-border-text {
      font-size: 5rem;
      font-weight: bold;
      color: white; /* Text fill color */
      -webkit-text-stroke: 2px transparent; /* Border placeholder */
      background: linear-gradient(90deg, #00c6ff, #ff8ff5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; /* Makes the main text transparent */
      -webkit-text-stroke: 2px; /* Applies the gradient stroke */
    }
  </style>
</head>
<body>
  <div class="gradient-border-text">Gradient</div>
</body>
</html>
